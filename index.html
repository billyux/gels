<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>고령자 AI 케어 - 통합 대시보드</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/fonts-archive/HakgyoansimTteokbokkiB/Hakgyoansim_TteokbokkiB.css" type="text/css" />
<style>
    /* ----------------------------------
       디자인 테마 변수 설정 (이미지 기준)
    ---------------------------------- */
    :root {
        --bg-color: #f4f1ea;         /* 배경색 (화이트 세이지) */
        --card-bg: #ffffff;         /* 카드 배경 (순백색) */
        --text-main: #333333;       /* 메인 텍스트 */
        --text-sub: #777777;        /* 보조 텍스트 */
        --primary-color: #90a97a;   /* 연두색 (메인 포인트) */
        --accent-color: #c89c87;    /* 살구색 (서브 포인트) */
        --border-color: #e0e0e0;    /* 테두리 색상 */
        --font-family: 'Segoe UI', Roboto, 'Noto Sans KR', sans-serif;
    }

    body {
        font-family: var(--font-family);
        margin: 0;
        background: var(--bg-color);
        color: var(--text-main);
        display: flex;
        min-height: 100vh;
        word-break: keep-all;
        overflow-wrap: break-word;
    }

    /* 좁은 화면(모바일)에서는 사이드바를 위로, 본문을 아래로 쌓아서
       본문 폭이 비정상적으로 좁아지는 것을 막음 */
    @media (max-width: 720px) {
        body { flex-direction: column; }
        .sidebar { width: 100%; box-sizing: border-box; }
    }

    /* ----------------------------------
       레이아웃 (왼쪽 메뉴 + 메인 콘텐츠)
    ---------------------------------- */
    /* 왼쪽 메뉴바 스타일 (기존 디자인 참고) */
    .sidebar {
        width: 250px;
        background: var(--card-bg);
        border-right: 1px solid var(--border-color);
        padding: 30px;
        display: none;
        flex-direction: column;
        box-sizing: border-box;
    }

    body.authed .sidebar { display: flex; }

    .logo {
        font-family: 'Hakgyoansim Tteokbokki B', var(--font-family);
        font-size: 30px;
        font-weight: bold;
        color: var(--primary-color);
        margin-bottom: 40px;
    }

    .profile-short {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 30px;
        padding-bottom: 20px;
        border-bottom: 1px solid var(--border-color);
    }

    .avatar {
        width: 40px; height: 40px;
        border-radius: 50%;
        background: #fdf8f0;
        overflow: hidden;
        flex: none;
    }

    .avatar svg { display: block; width: 100%; height: 100%; }

    .menu-list a {
        display: block;
        padding: 12px 15px;
        color: var(--text-sub);
        text-decoration: none;
        border-radius: 8px;
        transition: 0.2s;
    }

    .menu-list a:hover, .menu-list a.active {
        background: #f0f8e8;
        color: var(--primary-color);
        font-weight: 500;
    }

    /* 메인 랩퍼 */
    .main-content {
        flex: 1;
        padding: 30px;
    }

    /* 헤더 영역 */
    header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 30px;
    }

    .page-title {
        font-family: 'Hakgyoansim Tteokbokki B', var(--font-family);
        font-size: 40px;
        font-weight: 700;
    }

    .top-profile {
        display: flex; align-items: center; gap: 15px;
    }
    .top-profile span { font-size: 14px; }

    /* ----------------------------------
       카드 디자인 (전면 수정)
    ---------------------------------- */
    .card {
        background: var(--card-bg);
        padding: 25px;
        border-radius: 15px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.05); /* 부드러운 그림자 */
    }

    .card h2 {
        font-size: 18px;
        margin-top: 0;
        margin-bottom: 20px;
        color: var(--text-main);
    }

    /* ----------------------------------
       개별 컴포넌트 스타일
    ---------------------------------- */
    /* 버튼 스타일 수정 */
    .btn-custom {
        background: var(--primary-color);
        color: white;
        border: none;
        padding: 10px 20px;
        border-radius: 8px;
        cursor: pointer;
        font-weight: 600;
        transition: 0.2s;
    }

    .btn-custom:hover { background: #7f966b; }

    .btn-danger {
        background: #ff7676;
        color: white;
        border: none;
        padding: 5px 10px;
        border-radius: 5px;
        font-size: 12px;
        cursor: pointer;
        margin-bottom: 10px;
    }

    /* 입력창 스타일 수정 */
    textarea, input {
        border: 1px solid var(--border-color);
        border-radius: 8px;
        background: #fafafa;
        font-family: var(--font-family);
    }

    textarea:focus, input:focus {
        outline: none;
        border-color: var(--primary-color);
    }

    /* 채팅 UI 스타일 (말풍선 개선) */
   .chat{
    height:200px;
    overflow-y:auto;
    overflow-x:hidden;

    display:flex;
    flex-direction:column;

    background:#f5f7fb;
    border-radius:15px;
    padding:15px;
}

    .user,
.ai{

    max-width:70%;

    padding:12px 18px;

    border-radius:18px;

    margin:8px;

    white-space:pre-wrap;

    word-break:break-word;

    overflow-wrap:anywhere;

    box-sizing:border-box;
}

    .user {
        background: var(--primary-color);
        color: white;
        border-radius: 10px 10px 0 10px;
    }

    .ai {
        background: var(--card-bg);
        border: 1px solid var(--border-color);
        border-radius: 10px 10px 10px 0;
    }

    .thinking-dot {
        display: inline-block;
        width: 7px; height: 7px;
        margin: 0 2px;
        border-radius: 50%;
        background: var(--text-sub);
        animation: thinking-bounce 1.2s infinite ease-in-out;
    }

    .thinking-dot:nth-child(2) { animation-delay: 0.2s; }
    .thinking-dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes thinking-bounce {
        0%, 80%, 100% { transform: translateY(0); opacity: 0.5; }
        40% { transform: translateY(-5px); opacity: 1; }
    }

    /* 게시판 테이블 스타일 */
    .post-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 14px;
    }

    .post-table th {
        text-align: left;
        padding: 12px 5px;
        border-bottom: 2px solid var(--border-color);
        color: var(--text-sub);
        font-weight: normal;
    }

    .post-table td {
        padding: 15px 5px;
        border-bottom: 1px solid var(--border-color);
        color: var(--text-main);
    }

    .post-table tr:hover td { background: #f9f9f9; }

    .screen { display: none; flex: 1; min-width: 0; box-sizing: border-box; }
.screen.active { display: block; }
@media print {
    nav, .top-profile, .btn-custom, .no-print { display: none !important; }
    #health-screen.active { display: block !important; }
    body, main, .screen { background: #fff !important; }
}
</style>

<script>
/* ======================
   🔌 백엔드 API 초기화
====================== */
const API_BASE = "https://gels-mpsf.onrender.com/api";
const AUTH_TOKEN_KEY = "gels_token";

function getToken(){
    return localStorage.getItem(AUTH_TOKEN_KEY);
}

function setToken(token){
    if(token) localStorage.setItem(AUTH_TOKEN_KEY, token);
    else localStorage.removeItem(AUTH_TOKEN_KEY);
}

// path, { method, body, isForm } -> body는 JSON 객체(기본) 또는 FormData(isForm:true)
async function apiFetch(path, { method = "GET", body, isForm = false } = {}){
    const headers = {};
    const token = getToken();
    if(token) headers["Authorization"] = `Bearer ${token}`;
    if(body && !isForm) headers["Content-Type"] = "application/json";

    const res = await fetch(`${API_BASE}${path}`, {
        method,
        headers,
        body: body ? (isForm ? body : JSON.stringify(body)) : undefined,
    });

    const data = await res.json().catch(() => ({}));
    if(!res.ok) throw new Error(data.error || `요청 실패 (${res.status})`);
    return data;
}

/* ======================
   🔐 로그인 / 회원가입
====================== */
async function signUp(){
    const name = document.getElementById("authName").value.trim();
    const username = document.getElementById("authUsername").value.trim();
    const password = document.getElementById("authPassword").value;
    const errEl = document.getElementById("authError");
    errEl.style.color = "#ff7676";
    errEl.textContent = "";

    if(!name || !username || !password){
        errEl.textContent = "이름, 아이디, 비밀번호를 모두 입력하세요.";
        return;
    }

    try{
        const { token } = await apiFetch("/auth/signup", { method: "POST", body: { name, username, password } });
        setToken(token);
        // 가입과 동시에 로그인 세션이 발급되므로, 따로 로그인 버튼을 누를 필요 없이 바로 입장
        await enterApp();
    }catch(error){
        errEl.textContent = error.message;
    }
}

async function signIn(){
    const username = document.getElementById("authUsername").value.trim();
    const password = document.getElementById("authPassword").value;
    const errEl = document.getElementById("authError");
    errEl.style.color = "#ff7676";
    errEl.textContent = "";

    try{
        const { token } = await apiFetch("/auth/signin", { method: "POST", body: { username, password } });
        setToken(token);
        await enterApp();
    }catch(error){
        errEl.textContent = error.message;
    }
}

async function logout(){
    setToken(null);
    document.body.classList.remove("authed");
    showScreen("auth-screen");
}

async function enterApp(){
    let user;
    try{
        ({ user } = await apiFetch("/me"));
    }catch{
        showScreen("auth-screen");
        return;
    }

    const name = user.display_name || user.username;
    document.getElementById("sidebarName").textContent = name;
    document.getElementById("topProfileName").textContent = `안녕하세요, ${name}님`;
    document.getElementById("settingsUsername").textContent = `로그인 아이디: ${user.username}`;

    document.body.classList.add("authed");
    showScreen("dashboard-screen");
}

/* ======================
   🎤 음성 입력
====================== */
function voiceInput(){

    const SpeechRecognition =
        window.SpeechRecognition || window.webkitSpeechRecognition;

    if(!SpeechRecognition){
        alert("이 브라우저는 음성 인식을 지원하지 않습니다.");
        return;
    }

    const rec = new SpeechRecognition();
    rec.lang = "ko-KR";
    rec.interimResults = false;

    rec.start();

    rec.onresult = (e) => {
        document.getElementById("input").value = e.results[0][0].transcript;
    };

    rec.onerror = () => {
        alert("음성 인식 실패");
    };
}

/* ======================
   🔊 음성 출력 (TTS)
====================== */
function speak(text){
    speechSynthesis.cancel();

    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = "ko-KR";
    utter.rate = 1;
    utter.pitch = 1;

    speechSynthesis.speak(utter);
}

/* ======================
   🤖 AI 채팅
====================== */
function add(type, text){
    const chat = document.getElementById("chat");

    const div = document.createElement("div");
    div.className = type;
    div.innerText = text;

    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
}

function showLoading(){
    const chat = document.getElementById("chat");

    const div = document.createElement("div");
    div.className = "ai";
    div.innerHTML = '<span class="thinking-dot"></span><span class="thinking-dot"></span><span class="thinking-dot"></span>';

    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;

    return div;
}

// AI 답변을 한 글자씩 타이핑하듯 보여줌
function typeAiMessage(text){
    return new Promise((resolve) => {
        const chat = document.getElementById("chat");

        const div = document.createElement("div");
        div.className = "ai";
        chat.appendChild(div);

        let i = 0;

        const timer = setInterval(() => {
            i += 2;
            div.textContent = text.slice(0, i);
            chat.scrollTop = chat.scrollHeight;

            if(i >= text.length){
                clearInterval(timer);
                div.textContent = text;
                resolve();
            }
        }, 25);
    });
}

function clearChat(){
    document.getElementById("chat").innerHTML = "";
}

async function ask(){

    const input = document.getElementById("input");
    const text = input.value.trim();
    if(!text) return;

    add("user", text);
    input.value = "";

    const loading = showLoading();

    try{
        // Gemini 호출은 백엔드 서버를 통해 처리합니다 (API 키 비노출)
        const data = await apiFetch("/ai-chat", { method: "POST", body: { text } });
        loading.remove();

        speak(data.answer);
        await typeAiMessage(data.answer);
    }catch(err){
        loading.remove();
        add("ai", "❌ 오류: " + err.message);
    }
}

/* ======================
   🩺 건강 기록
====================== */
async function openHealthScreen(){
    showScreen("health-screen");

    const area = document.getElementById("healthReportArea");
    area.innerHTML = '<p style="color:var(--text-sub);">불러오는 중...</p>';

    try{
        const { logs } = await apiFetch("/health-logs");
        renderHealthReport(logs);
    }catch(err){
        area.innerHTML = `<p style="color:#c0392b;">불러오지 못했습니다: ${err.message}</p>`;
    }
}

function renderHealthReport(logs){
    const area = document.getElementById("healthReportArea");

    if(!logs || logs.length === 0){
        area.innerHTML = '<p style="color:var(--text-sub);">아직 기록된 증상이 없어요. AI 상담에서 아픈 곳을 말씀해주시면 여기에 정리돼요.</p>';
        return;
    }

    // 진료과별로 묶기
    const byDept = {};
    for(const log of logs){
        const dept = log.department || "기타";
        if(!byDept[dept]) byDept[dept] = [];
        byDept[dept].push(log);
    }

    area.innerHTML = "";

    for(const dept of Object.keys(byDept)){
        const section = document.createElement("div");
        section.className = "card";
        section.style.marginBottom = "20px";

        const heading = document.createElement("h2");
        heading.style.fontSize = "17px";
        heading.textContent = `🏥 ${dept}`;
        section.appendChild(heading);

        const table = document.createElement("table");
        table.className = "post-table";
        table.innerHTML = `
            <thead>
                <tr>
                    <th>날짜</th>
                    <th>말씀하신 내용</th>
                    <th>증상</th>
                    <th>추정 병명</th>
                    <th class="no-print">관리</th>
                </tr>
            </thead>
            <tbody></tbody>
        `;

        const tbody = table.querySelector("tbody");
        for(const log of byDept[dept]){
            const tr = document.createElement("tr");

            const dateTd = document.createElement("td");
            dateTd.textContent = (log.created_at || "").slice(0, 16).replace("T", " ");
            tr.appendChild(dateTd);

            const msgTd = document.createElement("td");
            msgTd.textContent = log.message;
            tr.appendChild(msgTd);

            const symptomTd = document.createElement("td");
            symptomTd.textContent = log.symptom || "-";
            tr.appendChild(symptomTd);

            const condTd = document.createElement("td");
            condTd.textContent = log.possible_condition || "-";
            tr.appendChild(condTd);

            const manageTd = document.createElement("td");
            manageTd.className = "no-print";
            const delBtn = document.createElement("button");
            delBtn.textContent = "삭제";
            delBtn.className = "btn-danger";
            delBtn.onclick = () => deleteHealthLog(log.id);
            manageTd.appendChild(delBtn);
            tr.appendChild(manageTd);

            tbody.appendChild(tr);
        }

        section.appendChild(table);
        area.appendChild(section);
    }
}

async function deleteHealthLog(id){
    try{
        await apiFetch(`/health-logs/${id}`, { method: "DELETE" });
        openHealthScreen();
    }catch(err){
        alert("삭제하지 못했습니다: " + err.message);
    }
}

function showScreen(screenId){
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(screenId).classList.add('active');
}

/* ======================
   🚀 시작
====================== */
window.onload = async () => {
    if(getToken()){
        await enterApp();
    }else{
        showScreen("auth-screen");
    }
};
</script>
